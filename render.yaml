services:
  - type: web
    name: econosight
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        value: https://sgqsaugbjyjuogxrzgpx.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: EXCHANGE_RATE_API_KEY
        sync: false
      - key: APP_SECRET_KEY
        generateValue: true
