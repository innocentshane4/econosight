{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div style="padding:4rem 2rem;">
    <div class="form-box">
        <h2 class="form-title">Welcome Back</h2>
        <p class="form-sub">Log in to access your dashboard and API key.</p>
        <div id="alert" class="alert"></div>
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="you@example.com">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Your password">
        </div>
        <button class="form-submit" onclick="loginUser()">Login</button>
        <p class="form-link">No account yet? <a href="/register">Create one free</a></p>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
async function loginUser() {
    const email = document.getElementById("email").value.trim();
    const pass  = document.getElementById("password").value;
    if (!email || !pass) return showAlert("alert", "Email and password are required.", "error");
    try {
        const data = await apiFetch("/auth/login", {
            method: "POST",
            body: JSON.stringify({ email, password: pass })
        });
        localStorage.setItem("es_token", data.access_token);
        localStorage.setItem("es_user", JSON.stringify(data.user));
        window.location.href = "/dashboard";
    } catch(e) {
        showAlert("alert", e.message, "error");
    }
}
</script>
{% endblock %}
