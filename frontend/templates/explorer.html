{% extends "base.html" %}
{% block title %}Data Explorer{% endblock %}

{% block content %}
<div class="section" style="max-width:1200px;">
    <div class="page-header">
        <h1 class="section-title">Data Explorer</h1>
        <p class="section-sub">Select a country and indicator to visualise historical economic data.</p>
    </div>

    <!-- Controls -->
    <div class="card" style="margin-bottom:2rem;">
        <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:1rem; align-items:end;">
            <div class="form-group" style="margin:0;">
                <label>Country</label>
                <select id="country-select"></select>
            </div>
            <div class="form-group" style="margin:0;">
                <label>Indicator</label>
                <select id="indicator-select"></select>
            </div>
            <div class="form-group" style="margin:0;">
                <label>Compare with</label>
                <select id="compare-select">
                    <option value="">None</option>
                </select>
            </div>
            <button class="btn btn-primary" onclick="loadChart()" style="height:44px;">View Data</button>
        </div>
    </div>

    <!-- Metrics row -->
    <div class="metrics-row" id="metrics-row" style="display:none;"></div>

    <!-- Chart -->
    <div class="card" id="chart-card" style="display:none;">
        <div id="main-chart" style="height:420px;"></div>
    </div>

    <!-- Data table -->
    <div class="card" style="margin-top:1.5rem; display:none;" id="table-card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
            <h3 style="font-weight:700; color:#0d1b2a;">Data Table</h3>
            <button class="btn btn-sm btn-outline" onclick="exportCSV()" style="color:#0d1b2a; border-color:#0d1b2a;">Export CSV</button>
        </div>
        <div style="overflow-x:auto;">
            <table class="data-table" id="data-table">
                <thead><tr><th>Country</th><th>Year</th><th>Value</th></tr></thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<script>
let currentData = [];
let currentIndicator = "";

async function initSelects() {
    const [countries, indicators] = await Promise.all([
        apiFetch("/data/countries"),
        apiFetch("/data/indicators")
    ]);

    const countrySelect  = document.getElementById("country-select");
    const compareSelect  = document.getElementById("compare-select");
    const indicatorSelect = document.getElementById("indicator-select");

    const all = { ...countries.african, ...countries.global };
    const urlParams = new URLSearchParams(window.location.search);
    const preselect = urlParams.get("country");

    Object.entries(all).forEach(([code, name]) => {
        const o = new Option(name, code);
        if (code === (preselect || "ZA")) o.selected = true;
        countrySelect.add(o.cloneNode(true));
        compareSelect.add(new Option(name, code));
    });
    compareSelect.insertBefore(new Option("None", ""), compareSelect.firstChild);
    compareSelect.value = "";

    Object.entries(indicators).forEach(([code, name]) => {
        indicatorSelect.add(new Option(name, code));
    });

    loadChart();
}

async function loadChart() {
    const country   = document.getElementById("country-select").value;
    const indicator = document.getElementById("indicator-select").value;
    const compare   = document.getElementById("compare-select").value;

    currentIndicator = indicator;
    document.getElementById("chart-card").style.display  = "none";
    document.getElementById("table-card").style.display  = "none";
    document.getElementById("metrics-row").style.display = "none";

    try {
        let url = `/data/compare?countries=${country}&indicator=${indicator}`;
        if (compare && compare !== country) url = `/data/compare?countries=${country},${compare}&indicator=${indicator}`;
        const result = await apiFetch(url);
        currentData = result.data;

        if (!currentData.length) {
            alert("No data available for this selection.");
            return;
        }

        // Metrics
        const latest = currentData.filter(d => d.country_code === country).sort((a,b)=>b.year-a.year);
        if (latest.length) {
            const row = latest[0];
            const prev = latest[1];
            const change = prev ? ((row.value - prev.value) / Math.abs(prev.value) * 100).toFixed(1) : null;
            document.getElementById("metrics-row").style.display = "grid";
            document.getElementById("metrics-row").innerHTML = `
                <div class="metric-card">
                    <div class="metric-label">Latest Value (${row.year})</div>
                    <div class="metric-value">${formatValue(row.value, row.indicator_name)}</div>
                    <div class="metric-sub">${row.indicator_name}</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Year-on-Year Change</div>
                    <div class="metric-value" style="color:${change > 0 ? '#0a7a5c' : '#c0392b'}">${change ? (change > 0 ? '+' : '') + change + '%' : 'N/A'}</div>
                    <div class="metric-sub">vs ${prev?.year || 'N/A'}</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Data Points</div>
                    <div class="metric-value">${currentData.length}</div>
                    <div class="metric-sub">Across all selected countries</div>
                </div>
            `;
        }

        // Chart
        document.getElementById("chart-card").style.display = "block";
        renderLineChart("main-chart", currentData, result.indicator || indicator, "");

        // Table
        document.getElementById("table-card").style.display = "block";
        const tbody = document.getElementById("table-body");
        tbody.innerHTML = currentData.sort((a,b)=>b.year-a.year).map(r => `
            <tr>
                <td>${r.country_name}</td>
                <td>${r.year}</td>
                <td>${formatValue(r.value, r.indicator_name)}</td>
            </tr>
        `).join("");

    } catch(e) {
        alert("Failed to load data: " + e.message);
    }
}

function exportCSV() {
    if (!currentData.length) return;
    const header = "Country,Year,Indicator,Value\n";
    const rows = currentData.map(r => `${r.country_name},${r.year},${r.indicator_name},${r.value}`).join("\n");
    const blob = new Blob([header + rows], { type: "text/csv" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "econosight_data.csv";
    a.click();
}

initSelects();
</script>
{% endblock %}
